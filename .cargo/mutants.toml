# Three layers, each of which can hide a finding rather than change one.
#
# The rules layer decides what is reported. `suppression.rs` decides what is silenced, so a
# surviving mutant there hides findings rather than changing them, which is the failure a
# reader cannot see. It earned its place: an off-by-one in the containment test shipped past
# review, and a `<=` to `<` mutant is exactly the shape of it.
#
# The analysers decide what is *seen*, and that is the layer #81 was lost in: the rule above
# it was mutation-clean for its whole life while the adapter resolved a Python `except`
# body by position, so the two forms real code writes reported nothing. A rule that reports
# the wrong thing fails a fixture loudly; an adapter that never emits the fact produces
# silence, and silence is what a passing suite looks like.
#
# `.github/workflows/mutants.yml` triggers on exactly these paths, and
# `check_mutation_scope` in `scripts/validate-pull-request.py` fails if the two disagree.
examine_globs = [
    "crates/godlint-core/src/analyzers/*.rs",
    "crates/godlint-core/src/rules/*.rs",
    "crates/godlint-core/src/suppression.rs",
]

# The whole workspace's tests decide whether a mutant is caught. Scoping to the mutated
# package alone would omit the CLI fixture corpus, which is what catches most rule
# changes, and would report survivors that are in fact well covered.
test_workspace = true

timeout_multiplier = 5.0
minimum_test_timeout = 60

exclude_re = [
    # The cursor only skips comments that can no longer overlap a later line, so failing
    # to advance it costs time and changes nothing. No test can distinguish this mutant
    # from the original, which makes it an equivalent mutant rather than a missing case.
    "replace < with > in effective_line_count",
    # Stopping the line walk from advancing does not produce a wrong answer, it stops the
    # walk from finishing. The suite notices, but as non-termination rather than as a
    # failed assertion, and whether that reads as a timeout depends on how fast the runner
    # is. Gating on it would be flaky rather than informative.
    "replace \\+= with \\*= in effective_line_count",
]
