name: Run Godlint
description: Enforce one code policy across Rust, TypeScript, JavaScript and Python.
author: Tomer Gal

branding:
  icon: shield
  color: purple

inputs:
  version:
    description: >
      Godlint version to run, without a leading v. Defaults to the latest release. Pin it for a
      reproducible check, since a floating version changes what a pull request is held to without
      a commit saying so.
    required: false
    default: latest
  paths:
    description: Paths to check. Defaults to the whole working directory.
    required: false
    default: ""
  working-directory:
    description: Directory to run in, which is where godlint.yaml is read from.
    required: false
    default: "."
  summary:
    description: Write a summary of the findings to the job summary.
    required: false
    default: "true"

outputs:
  version:
    description: The Godlint version that ran, resolved if the input was latest.
    value: ${{ steps.install.outputs.version }}
  findings:
    description: How many findings were reported.
    value: ${{ steps.check.outputs.findings }}
  status:
    description: The exit status returned by Godlint.
    value: ${{ steps.check.outputs.status }}

runs:
  using: composite

  steps:
    # A release carries one archive per platform and a checksum beside it, so the binary is
    # verified rather than trusted. No toolchain is installed: this is the same file published to
    # npm, PyPI and the release page.
    - name: Install Godlint
      id: install
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="$REQUESTED"

        if [ "$version" = "latest" ]; then
          # The releases/latest page redirects to the tag, so the version comes from a redirect
          # rather than from api.github.com, which rate-limits an unauthenticated runner and answers
          # 403 without warning.
          resolved="$(
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/tomerwave/godlint/releases/latest
          )"
          version="${resolved##*/tag/v}"
          echo "::notice::Godlint $version resolved from latest. Pin the version for a check that cannot change under you."
        fi

        if [ -z "$version" ]; then
          echo "godlint-action: could not resolve a version to install." >&2
          exit 1
        fi

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)    target=x86_64-unknown-linux-gnu;  archive=tar.gz ;;
          Linux-ARM64)  target=aarch64-unknown-linux-gnu; archive=tar.gz ;;
          macOS-X64)    target=x86_64-apple-darwin;       archive=tar.gz ;;
          macOS-ARM64)  target=aarch64-apple-darwin;      archive=tar.gz ;;
          Windows-X64)  target=x86_64-pc-windows-msvc;    archive=zip ;;
          *)
            echo "godlint-action: no Godlint binary for $RUNNER_OS-$RUNNER_ARCH." >&2
            exit 1
            ;;
        esac

        name="godlint-$target.$archive"
        base="https://github.com/tomerwave/godlint/releases/download/v$version"
        directory="$RUNNER_TEMP/godlint"

        mkdir -p "$directory"
        cd "$directory"
        curl -fsSL -O "$base/$name"
        curl -fsSL -O "$base/$name.sha256"

        # The published hash is compared directly rather than through shasum -c, which reads a
        # filename from the file and so fails on a checksum written with a carriage return. Only
        # the hash matters here, and the file being verified is the one just downloaded.
        published="$(cut -d' ' -f1 < "$name.sha256" | tr -d '\r\n')"

        if command -v shasum >/dev/null 2>&1; then
          computed="$(shasum -a 256 "$name" | cut -d' ' -f1)"
        else
          computed="$(sha256sum "$name" | cut -d' ' -f1)"
        fi

        if [ "$computed" != "$published" ]; then
          echo "godlint-action: checksum mismatch for $name" >&2
          echo "  published $published" >&2
          echo "  computed  $computed" >&2
          exit 1
        fi

        if [ "$archive" = "zip" ]; then
          unzip -q "$name"
        else
          tar -xzf "$name"
        fi

        echo "$directory" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # --format github turns each finding into an annotation on the exact line of the diff. It needs
    # no token and no permissions, which is why it also works on a pull request from a fork.
    - name: Run Godlint
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        set -uo pipefail

        # Fixed paths, written before anything here can fail, so a following step can read the
        # annotations and the exit status whatever this action's own outcome turns out to be.
        output="$RUNNER_TEMP/godlint-annotations.txt"
        status_file="$RUNNER_TEMP/godlint-status.txt"

        # A failing check is the expected case here, not an error to abort on: its status is the
        # whole point of the step. GitHub invokes this shell with -e, which the script's own set
        # cannot undo, so without turning it off the step ended at the pipeline below and never
        # reached a single line after it.
        set +e
        # shellcheck disable=SC2086
        godlint check --format github $PATHS 2>&1 | tee "$output"
        status=${PIPESTATUS[0]}
        set -e

        findings="$(grep -c '^::' "$output" || true)"
        echo "$status" > "$status_file"
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0

    # GitHub caps how many annotations it renders, so the summary carries the whole count per rule.
    # Without it a repository with more findings than the cap loses the rest silently.
    - name: Summarise
      if: ${{ inputs.summary == 'true' }}
      shell: bash
      env:
        FINDINGS: ${{ steps.check.outputs.findings }}
        VERSION: ${{ steps.install.outputs.version }}
      run: |
        set -euo pipefail

        output="$RUNNER_TEMP/godlint-annotations.txt"

        {
          echo "## Godlint $VERSION"
          echo

          if [ "$FINDINGS" = "0" ]; then
            echo "No findings."
          else
            echo "$FINDINGS findings. Each one is annotated on its line in Files changed."
            echo
            echo "| Rule | Findings |"
            echo "| --- | ---: |"
            sed -n 's/^::[a-z]* .*title=\([^:]*\)::.*/\1/p' "$output" |
              sort | uniq -c | sort -rn |
              awk '{ printf "| `%s` | %d |\n", $2, $1 }'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if Godlint failed
      shell: bash
      env:
        STATUS: ${{ steps.check.outputs.status }}
      run: |
        set -euo pipefail

        if [ "$STATUS" != "0" ]; then
          echo "godlint exited $STATUS" >&2
          exit "$STATUS"
        fi
