name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup component add clippy rustfmt --toolchain 1.97.1

      - name: Verify formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Lint the workspace
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo +1.97.1 test --workspace

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --workspace --no-deps
