name: Godlint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godlint:
    name: Check repository with Godlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      # Built from this checkout rather than installed from a release, so the check is of the code
      # in the pull request. --format github puts each finding on its own line in Files changed,
      # which is the same output the published action produces.
      - run: cargo +1.97.1 run -p godlint-cli -- check --format github .
