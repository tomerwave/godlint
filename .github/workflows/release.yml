name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agree:
    name: Check the tag agrees with the release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A tag is the only thing that starts a release, so it is the thing that must agree with
      # the manifest and the changelog. Publishing is irreversible: a version can be yanked but
      # never replaced, so these are checked before anything is built.
      - name: Require the tag, the manifest and the changelog to name one version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py "$TAG"

  binaries:
    name: Build ${{ matrix.target }}
    needs: agree
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            runnable: true
          # Cross-compiled on an arm runner, so the result cannot be executed here.
          - target: x86_64-apple-darwin
            runner: macos-latest
            runnable: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            runnable: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            runnable: true
          # Statically linked, which is what a container without glibc needs, and what the npm
          # packages ship so that one binary per architecture runs against either libc.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            runnable: true
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            runnable: true
            musl: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            runnable: true

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      - run: rustup target add ${{ matrix.target }} --toolchain 1.97.1

      # The grammars are C, so a musl binary needs a musl C compiler and not only the Rust target.
      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo +1.97.1 build --release --locked -p godlint-cli --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.musl && 'musl-gcc' || '' }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.musl && 'musl-gcc' || '' }}

      - name: Prove the binary runs and reports its version
        if: matrix.runnable
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          printed="$(./target/${{ matrix.target }}/release/godlint$suffix --version)"
          echo "$printed"
          printf '%s' "$printed" | grep -Fq "${TAG#v}"

      # A musl build exists to run where glibc is absent, so being static is the whole point and
      # worth asserting. file reports "static-pie linked"; ldd's wording for such a binary varies.
      - name: Prove the musl binary is static
        if: matrix.musl
        run: |
          described="$(file "target/${{ matrix.target }}/release/godlint")"
          echo "$described"
          printf '%s' "$described" | grep -q static

      - name: Package
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          install -m 755 "target/$TARGET/release/godlint" godlint
          tar -czf "godlint-$TARGET.tar.gz" godlint LICENSE README.md
          shasum -a 256 "godlint-$TARGET.tar.gz" > "godlint-$TARGET.tar.gz.sha256"

      # Windows has neither install nor shasum, and a zip is what a Windows user expects.
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          Copy-Item "target/$env:TARGET/release/godlint.exe" godlint.exe
          Compress-Archive -Path godlint.exe, LICENSE, README.md -DestinationPath "godlint-$env:TARGET.zip"
          $hash = (Get-FileHash "godlint-$env:TARGET.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  godlint-$env:TARGET.zip" | Out-File -Encoding ascii "godlint-$env:TARGET.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: godlint-${{ matrix.target }}
          path: |
            godlint-${{ matrix.target }}.tar.gz*
            godlint-${{ matrix.target }}.zip*
          if-no-files-found: error

      # The wrappers repackage the executable itself rather than an archive, and it is kept in a
      # separate artifact so the release carries archives only.
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            godlint
            godlint.exe
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: binaries
    runs-on: ubuntu-latest
    environment: crates-io

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      # The token is an environment secret rather than a repository one, so no other workflow
      # can read it.
      #
      # --workspace publishes in dependency order and waits for each crate to appear in the
      # index, so godlint-cli never races the godlint-core it depends on.
      - run: cargo +1.97.1 publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish to npm
    needs: binaries
    runs-on: ubuntu-latest
    environment: npm

    # id-token is what lets npm attach a provenance attestation tying each package to the commit
    # and workflow that built it. It is kept even while a token authenticates the publish, because
    # provenance comes from the identity rather than from the credential.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Newer than the npm bundled with Node, for provenance and for trusted publishing later.
      - run: npm install --global npm@latest

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries

      - name: Assemble the packages
        env:
          TAG: ${{ github.ref_name }}
        run: python3 packaging/build-npm.py "${TAG#v}" --binaries binaries --out packages

      # Every platform package must exist before the package that names them, or npm resolves an
      # optional dependency that is not published yet and installs no binary at all.
      # A trusted publisher cannot be configured for a name that does not exist yet, so the first
      # release authenticates with a token. Once these packages exist, configure trusted publishing
      # for each and delete both this env block and the secret.
      # Every path is prefixed with ./ because npm reads a bare owner/name as a git shorthand and
      # would try to fetch packages/cli-darwin-arm64 from GitHub. A dry run first, so a packaging
      # mistake is found before anything is uploaded and the version has to be burned.
      - name: Check every package packs
        run: |
          for package in ./packages/*; do
            npm publish "$package" --access public --dry-run
          done

      - name: Publish every platform package, then the one that names them
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in ./packages/cli-*; do
            npm publish "$package" --access public --provenance
          done
          npm publish ./packages/godlint --access public --provenance

  announce:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: godlint-*
          path: artifacts
          merge-multiple: true

      - name: Create the release from the changelog section
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-release.py "$TAG" --notes > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md artifacts/*
