name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agree:
    name: Check the tag agrees with the release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Require the tag, the manifest and the changelog to name one version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py "$TAG"

  binaries:
    name: Build ${{ matrix.target }}
    needs: agree
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            runnable: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            runnable: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            runnable: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            runnable: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            runnable: true
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            runnable: true
            musl: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            runnable: true

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      - run: rustup target add ${{ matrix.target }} --toolchain 1.97.1

      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo +1.97.1 build --release --locked -p godlint-cli --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.musl && 'musl-gcc' || '' }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.musl && 'musl-gcc' || '' }}

      - name: Prove the binary runs and reports its version
        if: matrix.runnable
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          printed="$(./target/${{ matrix.target }}/release/godlint$suffix --version)"
          echo "$printed"
          printf '%s' "$printed" | grep -Fq "${TAG#v}"

      - name: Prove the musl binary is static
        if: matrix.musl
        run: |
          described="$(file "target/${{ matrix.target }}/release/godlint")"
          echo "$described"
          printf '%s' "$described" | grep -q static

      - name: Package
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          install -m 755 "target/$TARGET/release/godlint" godlint
          tar -czf "godlint-$TARGET.tar.gz" godlint LICENSE README.md
          shasum -a 256 "godlint-$TARGET.tar.gz" > "godlint-$TARGET.tar.gz.sha256"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          Copy-Item "target/$env:TARGET/release/godlint.exe" godlint.exe
          Compress-Archive -Path godlint.exe, LICENSE, README.md -DestinationPath "godlint-$env:TARGET.zip"
          $hash = (Get-FileHash "godlint-$env:TARGET.zip" -Algorithm SHA256).Hash.ToLower()
          # WriteAllText rather than Out-File: Out-File ends the line with CRLF, and a checksum
          # file with a carriage return makes every Unix checker read the filename as ending in
          # one, so verification fails on a correct download.
          $line = "$hash  godlint-$env:TARGET.zip`n"
          [IO.File]::WriteAllText("$PWD/godlint-$env:TARGET.zip.sha256", $line)

      - uses: actions/upload-artifact@v4
        with:
          name: godlint-${{ matrix.target }}
          path: |
            godlint-${{ matrix.target }}.tar.gz*
            godlint-${{ matrix.target }}.zip*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            godlint
            godlint.exe
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: binaries
    runs-on: ubuntu-latest
    environment: crates-io

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      - run: cargo +1.97.1 publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish to npm
    needs: binaries
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global npm@latest

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries

      - name: Assemble the packages
        env:
          TAG: ${{ github.ref_name }}
        run: python3 packaging/build-npm.py "${TAG#v}" --binaries binaries --out packages

      - name: Check every package packs
        run: |
          while read -r package; do
            npm publish "$package" --access public --dry-run
          done < packages/publish-order

      - name: Publish in dependency order
        run: |
          while read -r package; do
            npm publish "$package" --access public --provenance
          done < packages/publish-order

  pypi:
    name: Publish to PyPI
    needs: binaries
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries

      - name: Build a wheel for every platform
        env:
          TAG: ${{ github.ref_name }}
        run: python3 packaging/build_wheels.py "${TAG#v}" --binaries binaries --out wheels

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: wheels

  announce:
    name: Publish the GitHub release
    needs: [publish, npm, pypi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: godlint-*
          path: artifacts
          merge-multiple: true

      - name: Publish the release and attach every archive
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 scripts/check-release.py "$TAG" --notes > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

          gh release upload "$TAG" artifacts/* --clobber

      - name: Every archive is attached
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected="$(find artifacts -type f | wc -l | tr -d ' ')"
          attached="$(gh release view "$TAG" --json assets --jq '.assets | length')"

          echo "$attached of $expected archives attached"
          test "$attached" -ge "$expected"

      - name: Point the floating major tag at this release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          major=v1

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$major" -f sha="$SHA" >/dev/null
          fi

          echo "$major now points at $SHA"

  homebrew:
    name: Update the Homebrew tap
    needs: announce
    runs-on: ubuntu-latest
    environment: homebrew-tap

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: godlint-*
          path: artifacts
          merge-multiple: true

      - name: Render the formula from the release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/tests/test_build_homebrew_formula.py
          python3 packaging/build_homebrew_formula.py "${TAG#v}" --assets artifacts --out Formula/godlint.rb

      - uses: actions/checkout@v4
        with:
          repository: tomerwave/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - name: Copy and validate the formula
        run: |
          install -m 644 Formula/godlint.rb tap/Formula/godlint.rb
          git -C tap diff --check

      - name: Commit the formula when it changed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git -C tap diff --quiet -- Formula/godlint.rb && { echo "Homebrew formula already names ${TAG#v}"; exit 0; }
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/godlint.rb
          git -C tap commit -m "brew: update godlint to ${TAG#v}"
          git -C tap push origin HEAD:main
