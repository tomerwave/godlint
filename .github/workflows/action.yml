name: Action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This compares the released binary against the code in the pull request, which is a signal worth
  # having and cannot be a gate: the pull request that fixes the binary cannot pass it, because the
  # fix is not released yet. It reports and does not block. Whether the action itself works is gated
  # by the job below, which does not depend on the release agreeing with this tree.
  repository:
    name: The released Godlint agrees with this tree
    runs-on: ${{ matrix.runner }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The action under test is this checkout, so a change to it is exercised by its own pull
      # request rather than only after release.
      # The repository itself, not a fixture: the action is held to the same tree the rest of CI is,
      # so a released binary that disagrees with this code is a failure here rather than a surprise
      # for whoever installs it.
      - uses: ./
        id: godlint
        continue-on-error: true
        with:
          summary: "false"

      - name: Say whether the release still agrees
        shell: bash
        env:
          OUTCOME: ${{ steps.godlint.outcome }}
          VERSION: ${{ steps.godlint.outputs.version }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice::Godlint $VERSION reports nothing against this tree."
            exit 0
          fi

          echo "::notice::The released Godlint reports findings against this tree. Expected while a rule or a fix is merged but not yet released; otherwise this repository has drifted from its own standard."

  dirty:
    name: The action fails a tree with findings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # continue-on-error, because the point is that it fails: the step must report a failure and
      # the annotations must still be emitted.
      - uses: ./
        id: godlint
        continue-on-error: true
        with:
          working-directory: .github/fixtures/action-dirty

      # The annotations file rather than an output or the summary: a composite action withholds its
      # outputs when it fails, and GITHUB_STEP_SUMMARY is a separate file per step, so neither is
      # readable from here. Failing is the thing being asserted, so the assertion cannot depend on
      # the action having succeeded.
      - name: A tree with findings fails and annotates both rules
        shell: bash
        env:
          OUTCOME: ${{ steps.godlint.outcome }}
        run: |
          set -euo pipefail

          annotations="$RUNNER_TEMP/godlint-annotations.txt"

          test "$OUTCOME" = "failure"
          grep -q '^::error .*title=architecture/filename-case::' "$annotations"
          grep -q '^::error .*title=logging/no-production-log::' "$annotations"
          echo "the action failed as it should, and annotated both rules"
