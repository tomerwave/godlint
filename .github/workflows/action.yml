name: Action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean:
    name: The action passes a clean tree
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The action under test is this checkout, so a change to it is exercised by its own pull
      # request rather than only after release.
      - uses: ./
        id: godlint
        with:
          working-directory: .github/fixtures/action-clean
          summary: "false"

      - name: A clean tree reports nothing and resolves a version
        shell: bash
        env:
          FINDINGS: ${{ steps.godlint.outputs.findings }}
          VERSION: ${{ steps.godlint.outputs.version }}
        run: |
          test "$FINDINGS" = "0"
          test -n "$VERSION"
          echo "godlint $VERSION reported $FINDINGS findings"

  dirty:
    name: The action fails a tree with findings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # continue-on-error, because the point is that it fails: the step must report a failure and
      # the annotations must still be emitted.
      - uses: ./
        id: godlint
        continue-on-error: true
        with:
          working-directory: .github/fixtures/action-dirty

      # The summary rather than the findings output: a composite action does not export its outputs
      # when it fails, and failing is what this asserts. The summary is written before that, and it
      # is what a person reads, so it is the better thing to hold to.
      - name: A tree with findings fails and says which rules
        shell: bash
        env:
          OUTCOME: ${{ steps.godlint.outcome }}
        run: |
          set -euo pipefail

          test "$OUTCOME" = "failure"
          grep -q 'architecture/filename-case' "$GITHUB_STEP_SUMMARY"
          grep -q 'logging/no-production-log' "$GITHUB_STEP_SUMMARY"
          echo "the action failed as it should, and named both rules in the summary"
