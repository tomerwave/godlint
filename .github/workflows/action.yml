name: Action

on:
  # labeled and unlabeled as well as the defaults, so applying a drift label re-evaluates the check.
  # Without them the label would appear to do nothing until the next push.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This compares the released binary against the code in the pull request. It fails when they
  # disagree, and says which of the two reasons it is, because red that needs a conversation to
  # interpret is worse than no check. It is not a required check, so it never blocks a merge.
  repository:
    name: The released Godlint agrees with this tree
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The action under test is this checkout, so a change to it is exercised by its own pull
      # request rather than only after release.
      # The repository itself, not a fixture: the action is held to the same tree the rest of CI is,
      # so a released binary that disagrees with this code is a failure here rather than a surprise
      # for whoever installs it.
      - uses: ./
        id: godlint
        continue-on-error: true
        with:
          summary: "false"

      - name: Say whether the release still agrees, and why if it does not
        shell: bash
        env:
          OUTCOME: ${{ steps.godlint.outcome }}
          FIXES_FALSE_POSITIVE: ${{ contains(github.event.pull_request.labels.*.name, 'fixes-false-positive') }}
          RELAXES_A_RULE: ${{ contains(github.event.pull_request.labels.*.name, 'relaxes-a-rule') }}
        run: |
          annotations="$RUNNER_TEMP/godlint-annotations.txt"
          version="$(godlint --version | cut -d' ' -f2)"

          if [ "$OUTCOME" = "success" ]; then
            echo "Godlint $version reports nothing against this tree."
            exit 0
          fi

          count="$(grep -c '^::' "$annotations" 2>/dev/null || echo 0)"

          {
            echo "The released Godlint $version reports $count findings against this tree."
            echo
            echo "This means one of two things."
            echo
            echo "1. This pull request fixed a false positive, so the released binary still"
            echo "   reports what the fix removed. Label it fixes-false-positive."
            echo
            echo "2. This pull request relaxed a rule, so the released binary still enforces the"
            echo "   stricter form. Label it relaxes-a-rule."
            echo
            echo "Either label passes this check and records which one it was. It goes green on its"
            echo "own after the next release."
            echo
            echo "3. Neither of those happened, and this repository has drifted from the standard"
            echo "   it publishes. Then the findings below are real and belong fixed here, and no"
            echo "   label is the right answer."
            echo
            echo "Adding a rule or tightening a threshold does not land here: the released binary is"
            echo "always the more permissive one, so it stays quiet."
            echo
            echo "Rules reported:"
            sed -n 's/^::[a-z]* .*title=\([^:]*\)::.*/  \1/p' "$annotations" | sort -u
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # A declared drift passes, because the disagreement was stated deliberately rather than
          # discovered. Which of the two it was is recorded, since that is the thing a reader of the
          # history wants and a single label could not say.
          if [ "$FIXES_FALSE_POSITIVE" = "true" ]; then
            echo "::notice::Declared: this pull request fixes a false positive, so the released binary still reports what the fix removed."
            exit 0
          fi

          if [ "$RELAXES_A_RULE" = "true" ]; then
            echo "::notice::Declared: this pull request relaxes a rule, so the released binary still enforces the stricter form."
            exit 0
          fi

          exit 1

  dirty:
    name: The action fails a tree with findings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # continue-on-error, because the point is that it fails: the step must report a failure and
      # the annotations must still be emitted.
      - uses: ./
        id: godlint
        continue-on-error: true
        with:
          working-directory: .github/fixtures/action-dirty

      # The annotations file rather than an output or the summary: a composite action withholds its
      # outputs when it fails, and GITHUB_STEP_SUMMARY is a separate file per step, so neither is
      # readable from here. Failing is the thing being asserted, so the assertion cannot depend on
      # the action having succeeded.
      - name: A tree with findings fails and annotates both rules
        shell: bash
        env:
          OUTCOME: ${{ steps.godlint.outcome }}
        run: |
          set -euo pipefail

          annotations="$RUNNER_TEMP/godlint-annotations.txt"

          test "$OUTCOME" = "failure"
          grep -q '^::error .*title=architecture/filename-case::' "$annotations"
          grep -q '^::error .*title=logging/no-production-log::' "$annotations"
          echo "the action failed as it should, and annotated both rules"
