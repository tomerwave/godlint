name: Action

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: The released Godlint agrees with this tree
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: ./
        id: godlint
        continue-on-error: true
        with:
          summary: "false"

      - name: Say whether the release still agrees, and why if it does not
        shell: bash
        env:
          OUTCOME: ${{ steps.godlint.outcome }}
          FIXES_FALSE_POSITIVE: ${{ contains(github.event.pull_request.labels.*.name, 'fixes-false-positive') }}
          RELAXES_A_RULE: ${{ contains(github.event.pull_request.labels.*.name, 'relaxes-a-rule') }}
        run: scripts/explain-released-agreement.sh

  dirty:
    name: The action fails a tree with findings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./
        id: godlint
        continue-on-error: true
        with:
          working-directory: .github/fixtures/action-dirty

      - name: A tree with findings fails and annotates both rules
        shell: bash
        env:
          OUTCOME: ${{ steps.godlint.outcome }}
          STATUS_OUTPUT: ${{ steps.godlint.outputs.status }}
          FINDINGS_OUTPUT: ${{ steps.godlint.outputs.findings }}
        run: |
          set -euo pipefail

          annotations="$RUNNER_TEMP/godlint-annotations.txt"

          test "$OUTCOME" = "failure"
          # Evidence for what docs/ci.md is allowed to claim: whether a composite action that fails
          # still hands over its outputs. The file is the contract either way, because it is written
          # before anything can fail.
          echo "outputs from a failed action: status='$STATUS_OUTPUT' findings='$FINDINGS_OUTPUT'"
          # Findings, and not some other way of failing: the action must carry Godlint's own status
          # out, or a tree it could not read at all would fail this job exactly as findings do.
          test "$(cat "$RUNNER_TEMP/godlint-status.txt")" = "1"
          grep -q '^::error .*title=architecture/filename-case::' "$annotations"
          grep -q '^::error .*title=logging/no-production-log::' "$annotations"
          echo "the action failed with findings as it should, and annotated both rules"
