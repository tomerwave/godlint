name: Pull request

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate pull request invariants
    runs-on: ubuntu-latest

    steps:
      # The change-scoped checks need the release line, so shallow history is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository invariants
        run: python3 scripts/validate-pull-request.py

      - name: Test the branch-name check
        run: scripts/test-check-branch-name.sh

      - name: Test the released-agreement explanation
        run: scripts/test-explain-released-agreement.sh

      - name: Check what this change touched
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          python3 scripts/validate-pull-request.py \
            --release-line "origin/${{ github.event.repository.default_branch }}"

  branch-name:
    name: Check the branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A branch name is the first thing a reader of the history sees, so it carries the kind
      # of change. GitHub's own branch-name rule is not available on this plan, so the check
      # lives here: it cannot refuse the push, but it does refuse the merge.
      #
      # release is not a Conventional Commits type. It is here because a version bump is not
      # honestly any of them — chore/ says it is housekeeping when it is the one branch that
      # publishes — and because naming it plainly is worth more in the history than conforming.
      - name: Require a conventional prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: scripts/check-branch-name.sh
