name: Real-world corpus

on:
  # Cloning nine repositories, two of them three hundred megabytes, takes long enough that running
  # it on every pull request would tax every change for the sake of the few that can break it.
  pull_request:
    paths:
      - 'crates/godlint-core/src/analyzers/**'
      - 'crates/godlint-core/src/scan.rs'
      - 'crates/godlint-core/src/discovery.rs'
      - 'corpus/repositories.json'
      - 'scripts/check-real-world.py'
      - '.github/workflows/real-world.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: Read nine real repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - run: cargo +1.97.1 build --release -p godlint-cli

      # Release rather than debug: the corpus is a hundred thousand files, and a debug binary
      # spends longer scanning it than the runner should spend on a scheduled job.
      - name: Require that Godlint can still read code that ships
        run: python3 scripts/check-real-world.py target/release/godlint
