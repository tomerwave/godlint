name: Targets probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            runnable: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            runnable: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            runnable: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            runnable: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            runnable: true
            musl: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            runnable: true

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      - run: rustup target add ${{ matrix.target }} --toolchain 1.97.1

      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo +1.97.1 build --release --locked -p godlint-cli --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.musl && 'musl-gcc' || '' }}

      - name: Run it
        if: matrix.runnable
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          ./target/${{ matrix.target }}/release/godlint$suffix --version

      # A musl build exists to run where glibc is absent, so being static is the whole point and
      # worth asserting. file reports "static-pie linked"; ldd's wording for such a binary varies.
      - name: Prove the musl binary is static
        if: matrix.musl
        run: |
          described="$(file "target/${{ matrix.target }}/release/godlint")"
          echo "$described"
          printf '%s' "$described" | grep -q static
