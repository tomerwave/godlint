name: Mutation testing

on:
  pull_request:
    # Every path .cargo/mutants.toml examines, and nothing else. A path examined by the
    # config and missing here is the failure #88 records: the analysers were mutated by the
    # weekly sweep and by no pull request, so the layer that decides what is *seen* had no
    # gate on the day it changed. check_mutation_scope in scripts/validate-pull-request.py
    # keeps the two lists from drifting apart again.
    paths:
      - 'crates/godlint-core/src/analyzers/**'
      - 'crates/godlint-core/src/facts.rs'
      - 'crates/godlint-core/src/facts/**'
      - 'crates/godlint-core/src/rules/**'
      - 'crates/godlint-core/src/suppression.rs'
      - '.cargo/mutants.toml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    name: Prove the tests exercise what changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: rustup toolchain install 1.97.1 --profile minimal

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: cargo +1.97.1 install cargo-mutants --locked

      # Only the lines this pull request touched, so the check stays proportionate to it.
      # The diff is not narrowed by path: examine_globs already decides which files carry
      # mutants, and narrowing here as well is what let the two lists disagree. A diff
      # touching no examined file reports that it changes no Rust source and passes.
      - name: Alter the changed lines and require a test to notice
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > changed.diff
          cargo +1.97.1 mutants --no-shuffle -j 2 --in-diff changed.diff

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-changed
          path: mutants.out/

  everything:
    name: Prove the tests exercise every rule
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.97.1 --profile minimal

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: cargo +1.97.1 install cargo-mutants --locked

      - name: Alter every rule and require a test to notice
        run: cargo +1.97.1 mutants --no-shuffle -j 2

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-everything
          path: mutants.out/
