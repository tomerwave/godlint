name: Technical debt
description: Record a known shortcut, workaround, or suppression that should be repaid.
title: "debt: "
labels: [tech-debt]
body:
  - type: markdown
    attributes:
      value: |
        Debt is only debt if someone can find it later. An accountable exception in the
        codebase should point at an issue filed with this template. See
        docs/suppressions.md and docs/dogfooding.md.
  - type: textarea
    id: shortcut
    attributes:
      label: What was done instead of the right thing
      description: >-
        Describe the shortcut concretely. Link the code, the suppression directive, the
        exclude entry, or the configuration that encodes it.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it was the right call at the time
      description: >-
        Debt taken deliberately is a decision, not a mistake. State the constraint that
        made the shortcut preferable, so a future reader can tell whether it still holds.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: What it costs while it stands
      description: >-
        Who is slowed down, what is harder to change, or what is not being checked? Debt
        with no stated cost cannot be prioritised against anything.
    validations:
      required: true
  - type: dropdown
    id: form
    attributes:
      label: How it is recorded today
      options:
        - Inline suppression directive
        - An `exclude` entry in godlint.yaml
        - A rule threshold set looser than the profile
        - A coverage or mutation budget entry
        - Nothing yet, only this issue
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Expiry
      description: >-
        The date the exception lapses, written YYYY-MM-DD, matching the `expires=` on the
        directive if there is one. An open-ended exception is a permanent policy change and
        should be proposed as one instead.
      placeholder: "2027-01-31"
    validations:
      required: true
  - type: textarea
    id: repayment
    attributes:
      label: What repaying it looks like
      description: >-
        The concrete change that closes this issue, and how you would know it worked.
    validations:
      required: true
