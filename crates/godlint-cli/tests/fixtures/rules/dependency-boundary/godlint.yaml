version: 1

rules:
  architecture/dependency-boundary:
    severity: error
    layers:
      - name: ui
        paths:
          - src/ui/**
        modules:
          - crate::ui
          - ui
          - "@app/ui"
          - github.com/acme/ui
      - name: application
        paths:
          - src/app/**
        modules:
          - crate::app
          - app
          - "@app/app"
          - github.com/acme/app
      - name: domain
        paths:
          - src/domain/**
        modules:
          - crate::domain
          - domain
          - "@app/domain"
          - github.com/acme/domain
