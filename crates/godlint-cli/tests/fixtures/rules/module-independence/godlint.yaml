version: 1

rules:
  architecture/module-independence:
    severity: error
    sets:
      - name: features
        members:
          - name: billing
            paths:
              - src/billing/**
            modules:
              - crate::billing
              - billing
              - "@app/billing"
              - github.com/acme/billing
          - name: notifications
            paths:
              - src/notifications/**
            modules:
              - crate::notifications
              - notifications
              - "@app/notifications"
              - github.com/acme/notifications
