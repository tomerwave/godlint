name: CI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TITLE=${{ github.event.pull_request.title }}" >> "$GITHUB_ENV"'
      - run: |
          echo "${{ github.event.issue.body }}" >> "$GITHUB_PATH"
      - run: 'echo "TITLE=${{ github.event.issue.body }}" >> "${GITHUB_ENV}"'
      - run: 'echo "${{ github.event.pull_request.body }}" >> "${GITHUB_PATH}"'
