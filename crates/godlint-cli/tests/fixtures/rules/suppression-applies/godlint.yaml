version: 1

rules:
  maintainability/function-nesting:
    severity: error
    max-depth: 1
  maintainability/empty-function:
    severity: error
  policy/todo-requires-reference:
    severity: warning
  style/no-comments:
    severity: error
  policy/accountable-suppression:
    severity: error
    require-owner: true
    require-expiry: true
