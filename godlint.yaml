version: 1

fail-on: error

exclude:
  - .git
  - .mypy_cache
  - .next
  - .tox
  - .venv
  - __pycache__
  - build
  - coverage
  - dist
  - node_modules
  - target
  - vendor
  - crates/godlint-cli/tests/fixtures
  - .github/fixtures
  - scripts
  - packaging

suites:
  - recommended@1

rules:
  ci/no-monolithic-job:
    severity: error
    max-steps: 7
    # Matrix targets declare mutually exclusive platform steps; no target runs all eleven.
    allow-in:
      - .github/workflows/release.yml
