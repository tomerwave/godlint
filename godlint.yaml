version: 1

fail-on: error

# Every entry here names why it is here. The dogfooding policy forbids a *silent* global exclusion,
# and an exclusion is the widest instrument this configuration has: it drops a path from the scan
# for every rule at once, so what it hides is invisible to `godlint check` by construction.
exclude:
  # Not this repository's code. Build output, caches and installed dependencies. All twelve are
  # named because naming any path replaces the built-in list rather than adding to it.
  - .git
  - .mypy_cache
  - .next
  - .tox
  - .venv
  - __pycache__
  - build
  - coverage
  - dist
  - node_modules
  - target
  - vendor

  # Trees that exist in order to contain violations. These are the inputs the rule tests assert
  # against: scanning them reports 465 findings, every one a fixture's deliberate violation
  # attributed to Godlint.
  - crates/godlint-cli/tests/fixtures
  - .github/fixtures

  # The gate scripts and the package wrappers, which are this repository's own code — and
  # packaging/npm/shim.js ships to npm users, so it is product code. Scanning both reports 127
  # findings, and 78 of them are `style/no-comments` on Python and JavaScript that explains policy.
  # That rule's two settings are a severity and `allow-doc-comments`, neither of which is a path,
  # and nothing else in the configuration can scope a rule to a directory — so the only ways to
  # silence it here are removing the paths or writing 78 inline suppressions. That missing per-path
  # control is what makes this an exclusion instead of rule configuration, and the price is the 21
  # findings it hides along with the 106 it is for. docs/dogfooding.md itemises all of them, so the
  # cost is written where it can be argued with.
  - scripts
  - packaging

suites:
  - recommended@1
