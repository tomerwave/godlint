version: 1

fail-on: error

# Every entry here names why it is here. The dogfooding policy forbids a *silent* global exclusion,
# and an exclusion is the widest instrument this configuration has: it drops a path from the scan
# for every rule at once, so what it hides is invisible to `godlint check` by construction.
exclude:
  # Not this repository's code. Build output, caches and installed dependencies. All twelve are
  # named because naming any path replaces the built-in list rather than adding to it.
  - .git
  - .mypy_cache
  - .next
  - .tox
  - .venv
  - __pycache__
  - build
  - coverage
  - dist
  - node_modules
  - target
  - vendor

  # Trees that exist in order to contain violations. These are the inputs the rule tests assert
  # against: scanning them reports 467 findings — 465 in the CLI tree and 2 in the workflow
  # fixtures — every one a fixture's deliberate violation attributed to Godlint.
  - crates/godlint-cli/tests/fixtures
  - .github/fixtures

  # The gate scripts and the package wrappers, which are this repository's own code — and
  # packaging/npm/shim.js ships to npm users, so it is product code. Scanning both reports 131
  # findings, of which 110 are rules meeting code they were not written for: 82 style/no-comments
  # on Python and JavaScript that explains policy, 21 logging/no-production-log where a script's
  # print is its interface, and 7 architecture/restricted-call on files whose job is to exit.
  # Each of those three can now be declared per rule with allow-in, which was not true when this
  # exclusion was written, so what keeps it here is the remaining 21: real findings that would
  # fail the build, each wanting its own change. docs/dogfooding.md itemises all of them and
  # records what replacing this exclusion costs.
  - scripts
  - packaging

suites:
  - recommended@1
