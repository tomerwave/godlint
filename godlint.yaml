version: 1

rules:
  maintainability/cyclomatic-complexity:
    severity: warning
    max-complexity: 10
  maintainability/parameter-count:
    severity: warning
    max-parameters: 6
  policy/todo-requires-reference:
    severity: warning
    reference-prefixes:
      - '#'
      - fixture-
  maintainability/empty-function:
    severity: warning
    allow-names:
      - fixtureAllowed
      - fixtureViolation
      - fixtureNested
  maintainability/file-size:
    severity: warning
    max-lines: 500
    skip-blank-lines: true
    skip-comments: true
  maintainability/function-size:
    severity: error
    max-lines: 300
    skip-blank-lines: true
    skip-comments: true
  maintainability/function-nesting:
    severity: error
    max-depth: 5
