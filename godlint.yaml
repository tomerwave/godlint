version: 1

# Findings below this severity are reported without failing the build, which is what
# lets a new rule be adopted as a warning before it becomes blocking.
fail-on: error

# Test fixtures are deliberately non-conforming inputs, so they are excluded by path
# rather than by weakening a rule for the whole repository.
exclude:
  - .git
  - .mypy_cache
  - .next
  - .tox
  - .venv
  - __pycache__
  - build
  - coverage
  - dist
  - node_modules
  - target
  - vendor
  - crates/godlint-cli/tests/fixtures
  # Maintenance scripts are tooling rather than product source. The no-comments policy was
  # adopted for the Rust codebase, where the reasoning lives in docs/architecture.md
  # instead; a script that encodes a budget should carry the reason beside the number.
  - scripts

rules:
  maintainability/function-size:
    severity: error
    max-lines: 300
  maintainability/file-size:
    severity: warning
    max-lines: 500
  maintainability/function-nesting:
    severity: error
    max-depth: 3
  maintainability/parameter-count:
    severity: warning
    max-parameters: 6
  # Recalibrated against this repository once a multiway branch stopped counting once per
  # arm: the worst function measures 7 and the 90th percentile is 4, so 10 no longer
  # constrained anything. The old 10 came from an ESLint `complexity` setting, and ESLint
  # counts every `case`, so the number did not transfer with the metric.
  maintainability/decision-complexity:
    severity: warning
    max-complexity: 8
  # Counting `?` as an exit path raises Rust counts relative to a language that must
  # write `return`, so this threshold is calibrated above the roadmap's recommended 5.
  maintainability/return-count:
    severity: warning
    max-returns: 8
  maintainability/function-statements:
    severity: warning
    max-statements: 30
  maintainability/empty-function:
    severity: warning
  policy/todo-requires-reference:
    severity: warning
  style/no-comments:
    severity: error
    allow-doc-comments: false
  # An exception this project cannot fix yet must name someone and a date, which is what
  # docs/dogfooding.md asks of every exception. The rule cannot be suppressed, so setting
  # it to error means a lapsed expiry fails CI.
  policy/accountable-suppression:
    severity: error
    require-owner: true
    require-expiry: true
  policy/unused-suppression:
    severity: error
